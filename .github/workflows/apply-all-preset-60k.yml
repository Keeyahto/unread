name: Apply all preset 60k budgets

on:
  push:
    branches:
      - tune/summary-output-60k

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tune/summary-output-60k

      - name: Raise all preset budgets to at least 60k
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          minimum = 60000
          changed = []
          checked = []

          for lang in ("en", "ru"):
              for path in sorted((Path("presets") / lang).glob("*.md")):
                  if path.name.startswith("_"):
                      continue
                  text = path.read_text(encoding="utf-8")
                  if not text.startswith("---\n"):
                      raise SystemExit(f"missing frontmatter: {path}")
                  end = text.find("\n---\n", 4)
                  if end < 0:
                      raise SystemExit(f"unterminated frontmatter: {path}")
                  head = text[:end]
                  tail = text[end:]
                  for key in ("output_budget_tokens", "map_output_tokens"):
                      pat = re.compile(rf"(?m)^{key}:\s*(\d+)\s*$")
                      m = pat.search(head)
                      if not m:
                          raise SystemExit(f"missing {key}: {path}")
                      old = int(m.group(1))
                      new = max(old, minimum)
                      if new != old:
                          head = pat.sub(f"{key}: {new}", head, count=1)
                          changed.append(f"{path}:{key}:{old}->{new}")
                  path.write_text(head + tail, encoding="utf-8")
                  checked.append(str(path))

          print(f"checked_presets={len(checked)}")
          print(f"changed_fields={len(changed)}")
          for row in changed:
              print(row)

          for path_s in checked:
              text = Path(path_s).read_text(encoding="utf-8")
              for key in ("output_budget_tokens", "map_output_tokens"):
                  m = re.search(rf"(?m)^{key}:\s*(\d+)\s*$", text)
                  value = int(m.group(1)) if m else 0
                  if value < minimum:
                      raise SystemExit(f"verification failed: {path_s} {key}={value}")
          print("verification=PASS")
          PY

      - name: Show diff
        run: git diff -- presets/en presets/ru

      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/apply-all-preset-60k.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presets/en presets/ru .github/workflows/apply-all-preset-60k.yml
          git commit -m "tune(presets): raise map and final budgets to at least 60k"
          git push origin HEAD:tune/summary-output-60k
