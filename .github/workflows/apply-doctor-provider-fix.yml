name: Apply doctor provider-key fix

on:
  push:
    branches:
      - fix/doctor-provider-keys

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/doctor-provider-keys

      - name: Apply source and tests
        run: python .github/apply_doctor_provider_fix.py

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Format and lint
        run: |
          uv run ruff format unread/tg/commands.py tests/test_doctor_provider_keys.py
          uv run ruff check .
          uv run ruff format --check .

      - name: Targeted regression tests
        run: uv run pytest -q tests/test_doctor_provider_keys.py tests/test_credential_gating.py tests/test_minimax_adapter.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Commit validated fix
        run: |
          rm .github/workflows/apply-doctor-provider-fix.yml .github/apply-doctor-provider-fix.patch .github/apply_doctor_provider_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(doctor): make provider checks slot-aware"
          git push origin HEAD:fix/doctor-provider-keys
