name: Apply MiniMax provider patch

on:
  push:
    branches: [feat/minimax-provider]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/minimax-provider

      - name: Apply MiniMax provider changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              text = read(path)
              actual = text.count(old)
              if actual < count:
                  raise RuntimeError(f"{path}: expected at least {count} occurrences, found {actual}: {old[:120]!r}")
              write(path, text.replace(old, new, count))

          # ---------------------------------------------------------------- config
          replace(
              "unread/config.py",
              '_VALID_AI_PROVIDERS: frozenset[str] = frozenset({"openai", "openrouter", "anthropic", "google", "local"})',
              '_VALID_AI_PROVIDERS: frozenset[str] = frozenset({"openai", "openrouter", "anthropic", "minimax", "google", "local"})',
          )
          replace(
              "unread/config.py",
              'class AnthropicCfg(_StrictCfg):\n    api_key: str = ""\n\n\nclass GoogleCfg(_StrictCfg):',
              'class AnthropicCfg(_StrictCfg):\n    api_key: str = ""\n\n\nclass MiniMaxCfg(_StrictCfg):\n    """MiniMax text / multimodal API credentials.\n\n    Chat and vision use MiniMax\'s Anthropic-compatible endpoint. The\n    endpoint is fixed by the provider adapter so a generic ``ai.base_url``\n    override can never redirect this key to an unrelated host.\n    """\n\n    api_key: str = ""\n\n\nclass GoogleCfg(_StrictCfg):',
          )
          replace(
              "unread/config.py",
              '    anthropic: AnthropicCfg = Field(default_factory=AnthropicCfg)\n    google: GoogleCfg = Field(default_factory=GoogleCfg)',
              '    anthropic: AnthropicCfg = Field(default_factory=AnthropicCfg)\n    minimax: MiniMaxCfg = Field(default_factory=MiniMaxCfg)\n    google: GoogleCfg = Field(default_factory=GoogleCfg)',
          )
          replace(
              "unread/config.py",
              '    if api_key := _env("ANTHROPIC_API_KEY"):\n        raw["anthropic"]["api_key"] = api_key\n    if "google" not in raw:',
              '    if api_key := _env("ANTHROPIC_API_KEY"):\n        raw["anthropic"]["api_key"] = api_key\n    if "minimax" not in raw:\n        raw["minimax"] = {}\n    if api_key := _env("MINIMAX_API_KEY"):\n        raw["minimax"]["api_key"] = api_key\n    if "google" not in raw:',
          )
          replace(
              "unread/config.py",
              '        if not settings.anthropic.api_key and (k := persisted.get("anthropic.api_key")):\n            settings.anthropic.api_key = k\n        if not settings.google.api_key and (k := persisted.get("google.api_key")):',
              '        if not settings.anthropic.api_key and (k := persisted.get("anthropic.api_key")):\n            settings.anthropic.api_key = k\n        if not settings.minimax.api_key and (k := persisted.get("minimax.api_key")):\n            settings.minimax.api_key = k\n        if not settings.google.api_key and (k := persisted.get("google.api_key")):',
          )

          # ----------------------------------------------------------- secret allowlist
          replace(
              "unread/db/_keys.py",
              '        "anthropic.api_key",\n        "google.api_key",',
              '        "anthropic.api_key",\n        "minimax.api_key",\n        "google.api_key",',
          )

          # -------------------------------------------------------- Anthropic base reuse
          replace(
              "unread/ai/anthropic_provider.py",
              'class AnthropicProvider:\n    supports_web_search = True\n\n    name = "anthropic"',
              'class AnthropicProvider:\n    supports_web_search = True\n\n    name = "anthropic"\n    display_name = "Anthropic"',
          )
          replace(
              "unread/ai/anthropic_provider.py",
              'f"Anthropic {type(e).__name__} — retrying in {delay:.0f}s "',
              'f"{self.display_name} {type(e).__name__} — retrying in {delay:.0f}s "',
          )
          replace(
              "unread/ai/anthropic_provider.py",
              'f"Anthropic {e.status_code} — retrying in {delay:.0f}s "',
              'f"{self.display_name} {e.status_code} — retrying in {delay:.0f}s "',
          )

          # ------------------------------------------------------------ MiniMax chat
          write(
              "unread/ai/minimax_provider.py",
              '''"""MiniMax adapter using the vendor's Anthropic-compatible API."""\n\nfrom __future__ import annotations\n\nfrom unread.ai.anthropic_provider import AnthropicProvider\nfrom unread.ai.providers import ChatResult, ProviderUnavailableError\n\nMINIMAX_ANTHROPIC_BASE_URL = "https://api.minimax.io/anthropic"\nMINIMAX_OPENAI_BASE_URL = "https://api.minimax.io/v1"\n\n\nclass MiniMaxProvider(AnthropicProvider):\n    """MiniMax M-series through ``anthropic.AsyncAnthropic``.\n\n    MiniMax recommends its Anthropic-compatible Messages API for agentic\n    workloads. M3 is the provider default for both flagship and filter\n    slots. Native Anthropic server-side web-search tools are not exposed by\n    MiniMax, so web-search requests are deliberately disabled here.\n    """\n\n    name = "minimax"\n    display_name = "MiniMax"\n    supports_web_search = False\n    default_chat_model = "MiniMax-M3"\n    default_filter_model = "MiniMax-M3"\n\n    def __init__(self, settings) -> None:  # type: ignore[no-untyped-def]\n        try:\n            from anthropic import AsyncAnthropic\n        except ImportError as e:  # pragma: no cover — package is a project dependency\n            raise ProviderUnavailableError(\n                "MiniMax provider selected but the `anthropic` package isn't installed. "\n                "Run `uv sync --extra dev` (or pip install anthropic)."\n            ) from e\n        if not settings.minimax.api_key:\n            raise ProviderUnavailableError(\n                "MiniMax provider selected but `minimax.api_key` is empty. "\n                "Run `unread init` or `unread settings` to add one."\n            )\n        self._client = AsyncAnthropic(\n            api_key=settings.minimax.api_key,\n            base_url=MINIMAX_ANTHROPIC_BASE_URL,\n            timeout=settings.openai.request_timeout_sec,\n            max_retries=0,\n        )\n        self._settings = settings\n\n    async def chat(\n        self,\n        *,\n        model: str,\n        messages: list[dict[str, str]],\n        max_tokens: int,\n        temperature: float,\n        web_search: bool = False,\n    ) -> ChatResult:\n        # MiniMax's Anthropic-compatible endpoint does not implement\n        # Anthropic's server-side `web_search_*` tool. Force it off even if a\n        # caller accidentally ignores `supports_web_search=False`.\n        return await super().chat(\n            model=model,\n            messages=messages,\n            max_tokens=max_tokens,\n            temperature=temperature,\n            web_search=False,\n        )\n''',
          )

          # ------------------------------------------------------------- provider factory
          replace(
              "unread/ai/providers.py",
              '    if name == "anthropic":\n        from unread.ai.anthropic_provider import AnthropicProvider\n\n        return AnthropicProvider(settings)\n    if name == "google":',
              '    if name == "anthropic":\n        from unread.ai.anthropic_provider import AnthropicProvider\n\n        return AnthropicProvider(settings)\n    if name == "minimax":\n        from unread.ai.minimax_provider import MiniMaxProvider\n\n        return MiniMaxProvider(settings)\n    if name == "google":',
          )
          replace(
              "unread/ai/providers.py",
              '        "openai, openrouter, anthropic, google, local."',
              '        "openai, openrouter, anthropic, minimax, google, local."',
          )
          replace(
              "unread/ai/providers.py",
              '    if name == "anthropic":\n        from unread.ai.anthropic_provider import AnthropicProvider\n\n        return AnthropicProvider.default_chat_model, AnthropicProvider.default_filter_model\n    if name == "google":',
              '    if name == "anthropic":\n        from unread.ai.anthropic_provider import AnthropicProvider\n\n        return AnthropicProvider.default_chat_model, AnthropicProvider.default_filter_model\n    if name == "minimax":\n        from unread.ai.minimax_provider import MiniMaxProvider\n\n        return MiniMaxProvider.default_chat_model, MiniMaxProvider.default_filter_model\n    if name == "google":',
          )
          replace(
              "unread/ai/providers.py",
              '    "anthropic": "claude-haiku-4-5",\n    "google": "gemini-2.5-flash",',
              '    "anthropic": "claude-haiku-4-5",\n    "minimax": "MiniMax-M3",\n    "google": "gemini-2.5-flash",',
          )

          # -------------------------------------------------------------- model catalog
          minimax_models = '''\n\n# ----------------------- MiniMax (refreshed 2026-09-08) -------------------\n#\n# MiniMax M3 pricing is tiered by context. ModelInfo has one price row, so\n# use the current 512K–1M discounted tier ($0.60/$2.40, cache read $0.12)\n# rather than under-estimating a large unread run. Prompts <=512K are billed\n# at a lower tier by MiniMax; unread's estimate is intentionally conservative.\n\n_MINIMAX_MODELS: tuple[ModelInfo, ...] = (\n    ModelInfo(\n        "MiniMax-M3",\n        "MiniMax M3 — default (1M ctx)",\n        "chat",\n        0.60,\n        0.12,\n        2.40,\n        context_window=1_000_000,\n        max_output_tokens=131_072,\n    ),\n    ModelInfo(\n        "MiniMax-M2.7",\n        "MiniMax M2.7 — previous generation",\n        "filter",\n        0.30,\n        0.06,\n        1.20,\n        context_window=204_800,\n        max_output_tokens=131_072,\n    ),\n    ModelInfo(\n        "MiniMax-M2.7-highspeed",\n        "MiniMax M2.7 Highspeed — faster",\n        "filter",\n        0.60,\n        0.06,\n        2.40,\n        context_window=204_800,\n        max_output_tokens=131_072,\n    ),\n)\n'''
          replace(
              "unread/ai/models.py",
              '\n\n# ----------------------- OpenRouter ---------------------------------------',
              minimax_models + '\n\n# ----------------------- OpenRouter ---------------------------------------',
          )
          replace(
              "unread/ai/models.py",
              '    "anthropic": _ANTHROPIC_MODELS,\n    "google": _GOOGLE_MODELS,',
              '    "anthropic": _ANTHROPIC_MODELS,\n    "minimax": _MINIMAX_MODELS,\n    "google": _GOOGLE_MODELS,',
          )
          replace(
              "unread/ai/models.py",
              '        "claude-haiku-4-5",\n        # Google — all Gemini',
              '        "claude-haiku-4-5",\n        # MiniMax M3 is natively multimodal.\n        "MiniMax-M3",\n        # Google — all Gemini',
          )
          replace(
              "unread/ai/models.py",
              '    if lower.startswith(("gemini", "google")):\n        return "google"',
              '    if lower.startswith(("gemini", "google")):\n        return "google"\n    if lower.startswith("minimax-"):\n        return "minimax"',
          )
          replace(
              "unread/ai/models.py",
              '    return ("openai", "anthropic", "google", "openrouter", "local")',
              '    return ("openai", "anthropic", "minimax", "google", "openrouter", "local")',
          )
          replace(
              "unread/ai/models.py",
              '    "anthropic": 1.25,\n    "google": 1.25,',
              '    "anthropic": 1.25,\n    "minimax": 1.25,\n    "google": 1.25,',
          )

          # ------------------------------------------------------------- MiniMax vision
          replace(
              "unread/ai/vision_provider.py",
              '    name = "anthropic"\n    default_vision_model = "claude-haiku-4-5"',
              '    name = "anthropic"\n    display_name = "Anthropic"\n    default_vision_model = "claude-haiku-4-5"',
          )
          replace(
              "unread/ai/vision_provider.py",
              'f"Anthropic {type(e).__name__} — retrying in {delay:.0f}s "',
              'f"{self.display_name} {type(e).__name__} — retrying in {delay:.0f}s "',
          )
          replace(
              "unread/ai/vision_provider.py",
              '    if name == "anthropic":\n        return AnthropicVisionProvider(settings)\n    if name == "google":',
              '    if name == "anthropic":\n        return AnthropicVisionProvider(settings)\n    if name == "minimax":\n        from unread.ai.minimax_vision_provider import MiniMaxVisionProvider\n\n        return MiniMaxVisionProvider(settings)\n    if name == "google":',
          )
          replace(
              "unread/ai/vision_provider.py",
              '        "openai, openrouter, anthropic, google, local."',
              '        "openai, openrouter, anthropic, minimax, google, local."',
          )
          write(
              "unread/ai/minimax_vision_provider.py",
              '''"""MiniMax vision adapter via the Anthropic-compatible image format."""\n\nfrom __future__ import annotations\n\nfrom unread.ai.minimax_provider import MINIMAX_ANTHROPIC_BASE_URL\nfrom unread.ai.providers import ProviderUnavailableError\nfrom unread.ai.vision_provider import AnthropicVisionProvider\n\n\nclass MiniMaxVisionProvider(AnthropicVisionProvider):\n    name = "minimax"\n    display_name = "MiniMax"\n    default_vision_model = "MiniMax-M3"\n\n    def __init__(self, settings) -> None:  # type: ignore[no-untyped-def]\n        try:\n            from anthropic import AsyncAnthropic\n        except ImportError as e:  # pragma: no cover\n            raise ProviderUnavailableError(\n                "Vision via MiniMax selected but the `anthropic` package isn't installed. "\n                "Run `uv sync --extra dev`."\n            ) from e\n        if not settings.minimax.api_key:\n            raise ProviderUnavailableError(\n                "Vision via MiniMax selected but `minimax.api_key` is empty. "\n                "Run `unread settings` to add one."\n            )\n        self._client = AsyncAnthropic(\n            api_key=settings.minimax.api_key,\n            base_url=MINIMAX_ANTHROPIC_BASE_URL,\n            timeout=settings.openai.request_timeout_sec,\n            max_retries=0,\n        )\n        self._settings = settings\n''',
          )

          # ------------------------------------------------------------- model discovery
          minimax_fetch = '''\n\nasync def _fetch_minimax(settings) -> list[str]:  # type: ignore[no-untyped-def]\n    """Fetch models from MiniMax's documented Anthropic-compatible list endpoint."""\n    if not settings.minimax.api_key:\n        return []\n    try:\n        from anthropic import AsyncAnthropic\n    except ImportError:\n        return []\n    try:\n        from unread.ai.minimax_provider import MINIMAX_ANTHROPIC_BASE_URL\n\n        client = AsyncAnthropic(\n            api_key=settings.minimax.api_key,\n            base_url=MINIMAX_ANTHROPIC_BASE_URL,\n            timeout=settings.openai.request_timeout_sec,\n            max_retries=0,\n        )\n        page = await client.models.list()\n        return [mid for m in (getattr(page, "data", None) or []) if (mid := getattr(m, "id", "") or "")]\n    except Exception as e:\n        log.debug("model_listing.fetch_failed", provider="minimax", err=str(e)[:200])\n        return []\n'''
          replace(
              "unread/ai/model_listing.py",
              '\n\nasync def _fetch_google(settings) -> list[str]:',
              minimax_fetch + '\n\nasync def _fetch_google(settings) -> list[str]:',
          )
          replace(
              "unread/ai/model_listing.py",
              '    elif name == "anthropic":\n        raw = await _fetch_anthropic(settings)\n    elif name == "google":',
              '    elif name == "anthropic":\n        raw = await _fetch_anthropic(settings)\n    elif name == "minimax":\n        raw = await _fetch_minimax(settings)\n    elif name == "google":',
          )
          replace(
              "unread/ai/model_listing.py",
              '    if name == "anthropic":\n        return await _verify_anthropic(settings)\n    if name == "google":',
              '    if name == "anthropic":\n        return await _verify_anthropic(settings)\n    if name == "minimax":\n        return await _verify_minimax(settings)\n    if name == "google":',
          )
          minimax_verify = '''\n\nasync def _verify_minimax(settings) -> tuple[bool, str]:  # type: ignore[no-untyped-def]\n    if not settings.minimax.api_key:\n        return False, "no API key"\n    try:\n        from anthropic import AsyncAnthropic\n    except ImportError:\n        return False, "anthropic SDK not installed"\n    try:\n        from unread.ai.minimax_provider import MINIMAX_ANTHROPIC_BASE_URL\n\n        client = AsyncAnthropic(\n            api_key=settings.minimax.api_key,\n            base_url=MINIMAX_ANTHROPIC_BASE_URL,\n            timeout=min(10.0, settings.openai.request_timeout_sec),\n            max_retries=0,\n        )\n        await client.models.list()\n        return True, ""\n    except Exception as e:\n        if hasattr(e, "status_code") and getattr(e, "status_code", 0) == 401:\n            return False, "auth failed (invalid API key)"\n        return False, str(e)[:200] or type(e).__name__\n'''
          replace(
              "unread/ai/model_listing.py",
              '\n\nasync def _verify_google(settings) -> tuple[bool, str]:',
              minimax_verify + '\n\nasync def _verify_google(settings) -> tuple[bool, str]:',
          )

          # ------------------------------------------------------------- settings UI
          minimax_setting_row = '''    SettingDef(\n        "__api_key:minimax__",\n        "settings_cat_api_keys",\n        "api_key",\n        "set_label_api_key_minimax",\n        "set_desc_api_key_minimax",\n    ),\n'''
          replace(
              "unread/settings/commands.py",
              '    SettingDef(\n        "__api_key:google__",',
              minimax_setting_row + '    SettingDef(\n        "__api_key:google__",',
          )
          replace(
              "unread/settings/commands.py",
              '    "chat": ("openai", "openrouter", "anthropic", "google", "local"),\n    "filter": ("openai", "openrouter", "anthropic", "google", "local"),\n    "audio": ("openai", "local"),\n    "vision": ("openai", "openrouter", "anthropic", "google", "local"),',
              '    "chat": ("openai", "openrouter", "anthropic", "minimax", "google", "local"),\n    "filter": ("openai", "openrouter", "anthropic", "minimax", "google", "local"),\n    "audio": ("openai", "local"),\n    "vision": ("openai", "openrouter", "anthropic", "minimax", "google", "local"),',
          )
          replace(
              "unread/settings/commands.py",
              '    "anthropic": "anthropic.api_key",\n    "google": "google.api_key",',
              '    "anthropic": "anthropic.api_key",\n    "minimax": "minimax.api_key",\n    "google": "google.api_key",',
          )
          replace(
              "unread/settings/commands.py",
              '    "anthropic": "https://console.anthropic.com/settings/keys",\n    "google": "https://aistudio.google.com/app/apikey",',
              '    "anthropic": "https://console.anthropic.com/settings/keys",\n    "minimax": "https://platform.minimax.io/user-center/basic-information/interface-key",\n    "google": "https://aistudio.google.com/app/apikey",',
          )
          replace(
              "unread/settings/commands.py",
              '    return provider not in {"anthropic", "google"}',
              '    return provider not in {"anthropic", "minimax", "google"}',
          )
          replace(
              "unread/settings/commands.py",
              '    if name == "anthropic":\n        return s.anthropic.api_key or ""\n    if name == "google":',
              '    if name == "anthropic":\n        return s.anthropic.api_key or ""\n    if name == "minimax":\n        return s.minimax.api_key or ""\n    if name == "google":',
          )

          # --------------------------------------------------------------- i18n labels
          minimax_i18n = '''    "set_label_api_key_minimax": {"en": "MiniMax API key", "ru": "API-ключ MiniMax"},\n    "set_desc_api_key_minimax": {\n        "en": (\n            "MiniMax M3 through the Anthropic-compatible Messages API. Use MiniMax for "\n            "chat / filter / vision. M3 is the default for all three slots; audio stays "\n            "on OpenAI / local."\n        ),\n        "ru": (\n            "MiniMax M3 через Anthropic-совместимый Messages API. MiniMax доступен для "\n            "chat / filter / vision. Во всех трёх слотах по умолчанию используется M3; "\n            "audio остаётся на OpenAI / local."\n        ),\n    },\n'''
          replace(
              "unread/i18n.py",
              '    "set_label_api_key_google":',
              minimax_i18n + '    "set_label_api_key_google":',
          )

          # ---------------------------------------------------------- first-run wizard
          replace(
              "unread/tg/commands.py",
              '    if name == "anthropic":\n        return bool(settings.anthropic.api_key)\n    if name == "google":',
              '    if name == "anthropic":\n        return bool(settings.anthropic.api_key)\n    if name == "minimax":\n        return bool(settings.minimax.api_key)\n    if name == "google":',
          )
          minimax_choice = '''    (\n        "5",\n        "minimax",\n        "minimax.api_key",\n        "https://platform.minimax.io/user-center/basic-information/interface-key",\n        "MiniMax M3. Anthropic-compatible chat + image. No Whisper-shape audio.",\n    ),\n    (\n        "6",\n        "local",\n'''
          replace(
              "unread/tg/commands.py",
              '    (\n        "5",\n        "local",\n',
              minimax_choice,
          )
          replace(
              "unread/tg/commands.py",
              '"Whisper-shape API: openai, openrouter, local — picking anthropic / google "',
              '"Whisper-shape API: openai, local — picking anthropic / minimax / google "',
          )
          replace(
              "unread/tg/commands.py",
              '"Run `unread settings` (or set `OPENAI_API_KEY` / `ANTHROPIC_API_KEY` / etc. "',
              '"Run `unread settings` (or set `OPENAI_API_KEY` / `ANTHROPIC_API_KEY` / `MINIMAX_API_KEY` / etc. "',
          )
          replace(
              "unread/tg/commands.py",
              '    if name == "anthropic":\n        return settings.anthropic.api_key or ""\n    if name == "google":',
              '    if name == "anthropic":\n        return settings.anthropic.api_key or ""\n    if name == "minimax":\n        return settings.minimax.api_key or ""\n    if name == "google":',
          )

          # ------------------------------------------------------------ CLI credential gate
          replace(
              "unread/cli.py",
              '    if name == "anthropic":\n        return bool(s.anthropic.api_key)\n    if name == "google":',
              '    if name == "anthropic":\n        return bool(s.anthropic.api_key)\n    if name == "minimax":\n        return bool(s.minimax.api_key)\n    if name == "google":',
          )
          replace(
              "unread/cli.py",
              '        "  Anthropic  https://console.anthropic.com/settings/keys\\n"\n        "  Google',
              '        "  Anthropic  https://console.anthropic.com/settings/keys\\n"\n        "  MiniMax    https://platform.minimax.io/user-center/basic-information/interface-key\\n"\n        "  Google',
          )
          replace(
              "unread/cli.py",
              'env_lines = "  # any of: OPENAI_API_KEY / ANTHROPIC_API_KEY / GOOGLE_API_KEY / OPENROUTER_API_KEY"',
              'env_lines = "  # any of: OPENAI_API_KEY / ANTHROPIC_API_KEY / MINIMAX_API_KEY / GOOGLE_API_KEY / OPENROUTER_API_KEY"',
          )
          replace(
              "unread/cli.py",
              '        "anthropic": ("Anthropic (Claude)", "ANTHROPIC_API_KEY=sk-ant-…"),\n        "google":',
              '        "anthropic": ("Anthropic (Claude)", "ANTHROPIC_API_KEY=sk-ant-…"),\n        "minimax": ("MiniMax (M3)", "MINIMAX_API_KEY=sk-…"),\n        "google":',
          )

          # -------------------------------------------------------------- AI package docs
          replace(
              "unread/ai/__init__.py",
              'values: openai | openrouter | anthropic | google | local).',
              'values: openai | openrouter | anthropic | minimax | google | local).',
          )
          replace(
              "unread/ai/__init__.py",
              '  - `google`     — `google.genai.Client` (Gemini), chat + vision.',
              '  - `minimax`    — MiniMax M3 via the Anthropic-compatible Messages API,\n                   chat + vision.\n  - `google`     — `google.genai.Client` (Gemini), chat + vision.',
          )

          # -------------------------------------------------------------- examples
          replace(
              ".env.example",
              '# OpenAI API key\nOPENAI_API_KEY=\n',
              '# OpenAI API key\nOPENAI_API_KEY=\n\n# Optional alternative chat provider\nMINIMAX_API_KEY=\n',
          )
          replace(
              "config.toml.example",
              '#   google     — Gemini Developer API (gemini-2.5-flash / -lite by default).\n#                Set `[google] api_key`.',
