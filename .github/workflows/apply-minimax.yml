          replace(
              "tests/test_ai_env_overrides.py",
              'def test_chat_model_from_env(monkeypatch) -> None:',
              'def test_minimax_provider_and_key_from_env(monkeypatch) -> None:\n    monkeypatch.setenv("UNREAD_AI_CHAT_PROVIDER", "minimax")\n    monkeypatch.setenv("MINIMAX_API_KEY", "sk-mm-test")\n    s = load_settings()\n    assert s.ai.chat_provider == "minimax"\n    assert s.minimax.api_key == "sk-mm-test"\n\n\ndef test_chat_model_from_env(monkeypatch) -> None:',
          )

          replace(
              "tests/test_resolve_slots.py",
