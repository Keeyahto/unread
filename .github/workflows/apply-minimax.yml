          replace(
              ".github/workflows/ci.yml",
              '          ANTHROPIC_API_KEY: "sk-ant-test-fake"\n          GOOGLE_API_KEY:',
              '          ANTHROPIC_API_KEY: "sk-ant-test-fake"\n          MINIMAX_API_KEY: "sk-mm-test-fake"\n          GOOGLE_API_KEY:',
          )

          print("MiniMax provider patch applied")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Format new adapter files
        run: uv run ruff format unread/ai/minimax_provider.py unread/ai/minimax_vision_provider.py tests/test_minimax_adapter.py

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Full test suite
        run: uv run pytest -q

      - name: Commit tested implementation
        shell: bash
        run: |
          rm .github/workflows/apply-minimax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): add MiniMax M3 provider"
          git push origin HEAD:feat/minimax-provider
