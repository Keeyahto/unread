          )

          replace(
              "tests/test_models_registry.py",
              'from unread.ai.google_provider import GoogleProvider\n',
              'from unread.ai.google_provider import GoogleProvider\nfrom unread.ai.minimax_provider import MiniMaxProvider\n',
          )
          replace(
              "tests/test_models_registry.py",
              '    assert {"openai", "anthropic", "google", "openrouter", "local"} <= names',
