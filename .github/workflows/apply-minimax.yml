          )
          replace(
              "tests/test_models_registry.py",
              '        assert set(_SLOT_PROVIDERS[slot]) == {"openai", "openrouter", "anthropic", "google", "local"}',
              '        assert set(_SLOT_PROVIDERS[slot]) == {\n            "openai",\n            "openrouter",\n            "anthropic",\n            "minimax",\n            "google",\n            "local",\n        }',
          )

          replace(
              "tests/test_settings_provider_filter.py",
              '    for active in ("openai", "anthropic", "google", "openrouter", "local"):',
              '    for active in ("openai", "anthropic", "minimax", "google", "openrouter", "local"):',
