name: Apply MiniMax provider patch v4

on:
  push:
    branches: [feat/minimax-provider]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/minimax-provider

      - name: Extract and apply base patch
        shell: bash
        run: |
          python - <<'PYEXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/apply-minimax.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n      - name: Install uv"
          assert start in source and end in source
          body = source.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = ('\n'.join(lines) + '\n').replace('512K–1M', '512K-1M')
          Path('/tmp/apply_minimax_patch.py').write_text(script, encoding='utf-8')
          PYEXTRACT
          python /tmp/apply_minimax_patch.py

      - name: Apply UI integration fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'{path}: missing anchor: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'unread/bot/settings_menu.py',
              '    "anthropic": "anthropic.api_key",\n    "google": "google.api_key",',
              '    "anthropic": "anthropic.api_key",\n    "minimax": "minimax.api_key",\n    "google": "google.api_key",',
          )
          replace(
              'tests/test_interactive_setup.py',
              '# Folder=1, provider=5 (local), base_url=<empty: keep default>, Telegram=n\n    prompt_inputs = iter(["1", "5", ""])',
              '# Folder=1, provider=6 (local), base_url=<empty: keep default>, Telegram=n\n    prompt_inputs = iter(["1", "6", ""])',
          )
          replace(
              'tests/test_interactive_setup.py',
              '# Folder=1, provider=6 (Skip — last entry after the 5 providers\n    # plus a separator). Telegram=n. The Skip path takes no key prompt.\n    prompt_inputs = iter(["1", "6"])',
              '# Folder=1, provider=7 (Skip — last entry after the 6 providers\n    # plus a separator). Telegram=n. The Skip path takes no key prompt.\n    prompt_inputs = iter(["1", "7"])',
          )
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Format
        run: uv run ruff format .

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Targeted integration tests
        run: uv run pytest -q tests/test_bot_settings_menu.py tests/test_interactive_setup.py tests/test_minimax_adapter.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat(ai): add MiniMax M3 provider"
          git push origin HEAD:feat/minimax-provider
