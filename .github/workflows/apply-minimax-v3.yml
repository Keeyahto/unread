name: Apply MiniMax provider patch v3

on:
  push:
    branches: [feat/minimax-provider]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/minimax-provider

      - name: Extract and apply patch script
        shell: bash
        run: |
          python - <<'PYEXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/apply-minimax.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n      - name: Install uv"
          assert start in source and end in source
          body = source.split(start, 1)[1].split(end, 1)[0]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          script = script.replace('512K–1M', '512K-1M')
          Path('/tmp/apply_minimax_patch.py').write_text(script, encoding='utf-8')
          PYEXTRACT
          python /tmp/apply_minimax_patch.py

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Format
        run: uv run ruff format .

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Full test suite
        run: uv run pytest -q

      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat(ai): add MiniMax M3 provider"
          git push origin HEAD:feat/minimax-provider
